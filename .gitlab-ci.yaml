variables:
  TF_VAR_nutanix_username: ${NUTANIX_USERNAME}
  TF_VAR_nutanix_password: ${NUTANIX_PASSWORD}

stages:
  - prepare
  - plan
  - apply

prepare:
  stage: prepare
  script:
    # Create necessary Terraform files from pipeline variables
    - echo "$TERRAFORM_CONTENT" > vms/lan_vms.tf
    - echo "$TF_MAIN" > main.tf
    - echo "$TF_VARS" > variables.tf
    - echo "$TF_VARS_LAN_SUBNETS" > lan_subnets.tfvars
    - echo "$TF_VARS_STORAGE" > storage_containers.tfvars

plan:
  stage: plan
  script:
    - terraform init
    - terraform plan -var-file="lan_subnets.tfvars" -var-file="storage_containers.tfvars"
  artifacts:
    paths:
      - tfplan
    expire_in: 1 week

apply:
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  when: manual  # Requires manual approval