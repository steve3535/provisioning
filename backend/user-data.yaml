#cloud-config
hostname: ${vm_hostname}
fqdn: ${vm_hostname}

# Password configuration
chpasswd:
  list: |
    localadmin:L@lux0123456789#
  expire: false

# User & SSH configuration
users:
  - name: localadmin
    ssh_authorized_keys:
      - ${ssh_pub_key}

# Network configuration (early boot)
bootcmd:
  - nmcli con mod "System ens3" connection.id ens3
  - nmcli con mod ens3 ipv4.method manual ipv4.addresses ${vm_ip}/${vm_prefix} ipv4.gateway ${vm_gateway} ipv4.dns "${vm_dns1} ${vm_dns2}"
  - nmcli con up ens3

# SSH directory setup (after user creation)
runcmd:
  - mkdir -p /home/localadmin/.ssh
  - echo "${ssh_pub_key}" >> /home/localadmin/.ssh/authorized_keys
  - chown -R localadmin:localadmin /home/localadmin/.ssh
  - chmod 700 /home/localadmin/.ssh
  - chmod 600 /home/localadmin/.ssh/authorized_keys
  - restorecon -R /home/localadmin/.ssh